<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Video Cleaner</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

<h1>🎙 Video Cleaner</h1>

<p>
Reduce ruido de fondo usando FFmpeg WebAssembly.

</button>

id="preview"
controls>
</video>

<a id="downloadLink"></a>

</div>

<script type="module" src="app.js"></script>

</body>
</html>
